name: Fetch assets & deploy to GitHub Pages

on:
  push:
    branches: [claude/fable-showcase-websites-run1r4]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fable-showcase-websites-run1r4
      - name: Install media tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Fetch and optimize generated media
        id: fetch
        run: bash tools/fetch-assets.sh
      - name: Commit downloaded assets
        run: |
          git config user.name "asset-fetcher[bot]"
          git config user.email "actions@github.com"
          git add -A current/assets signal/assets atelier/assets
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized generated media assets"
            git push origin claude/fable-showcase-websites-run1r4
          else
            echo "no new assets"
          fi

  deploy:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fable-showcase-websites-run1r4
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          cp -r current signal atelier maison dusk sanctum _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "pages-deployer[bot]"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy static showcase"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
